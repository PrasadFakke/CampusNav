<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusNav • Favourites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body data-page="favourites">
    <main class="main">
      <header class="topbar">
        <div>
          <h1>Favourites</h1>
          <p class="subtitle">
            Saved to your MongoDB user account. Same list after login on any
            device.
          </p>
        </div>
      </header>
      <div class="content-grid">
        <div class="card">
          <div class="card-header"><h2>Add a location</h2></div>
          <div class="field" style="margin-bottom: 12px">
            <label>Campus place</label>
            <select id="addSelect"></select>
          </div>
          <button class="btn primary" id="addBtn" type="button">
            Save to Favourites
          </button>
          <p id="msg" class="subtitle" style="margin-top: 10px"></p>
        </div>
        <div class="card">
          <div class="card-header"><h2>My saved places</h2></div>
          <div id="favList"></div>
        </div>
      </div>
    </main>
    <script src="/js/graph-data.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/favourites.js"></script>
  </body>
</html>
