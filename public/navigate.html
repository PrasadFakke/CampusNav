<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusNav • Find Route</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    .route-form { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: end; margin-bottom: 16px; }
    .swap-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 42px; height: 42px; border-radius: 10px; cursor: pointer; }
    .result-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; min-height: 120px; }
    .path-list { list-style: none; }
    .path-list li { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
    .step-num { width: 30px; height: 30px; background: rgba(99,102,241,0.2); color: #a5b4fc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; }
    .algo-badge { display: inline-block; background: rgba(99,102,241,0.15); color: #a5b4fc; padding: 5px 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 14px; }
    .mini-svg { width: 100%; max-height: 320px; background: #12121a; border-radius: 10px; }
  </style>
</head>
<body data-page="navigate">
  <main class="main">
    <header class="topbar">
      <div>
        <h1>Find Shortest Route</h1>
        <p class="subtitle">Dijkstra on the campus graph. Blocked roads are skipped automatically.</p>
      </div>
      <a href="/map.html" class="btn primary">Open Full Map</a>
    </header>
    <div class="card">
      <div class="route-form">
        <div class="field"><label>From</label><select id="fromSelect"></select></div>
        <button class="swap-btn" id="swapBtn" type="button">⇄</button>
        <div class="field"><label>To</label><select id="toSelect"></select></div>
      </div>
      <p id="blockedNote" class="subtitle" style="margin-bottom:12px;"></p>
      <button class="btn primary" id="findBtn" style="width:100%;margin-bottom:16px;">Find Shortest Path (Dijkstra)</button>
      <div class="result-box" id="resultBox"><div class="empty">Select source and destination</div></div>
      <div id="mapPreview" style="display:none;margin-top:16px;">
        <svg class="mini-svg" id="miniMap" viewBox="0 0 800 700"></svg>
      </div>
    </div>
  </main>
  <script src="/js/graph-data.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/navigate.js"></script>
</body>
</html>
