<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusNav • Find Route</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    .route-form {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: end;
      margin-bottom: 20px;
    }
    .swap-btn {
      background: var(--bg-subtle);
      border: 1.5px solid var(--border);
      color: var(--primary);
      width: 46px;
      height: 46px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    .swap-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary-border);
      transform: rotate(180deg);
    }
    .result-box {
      background: var(--bg-subtle);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      min-height: 120px;
    }
    .path-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .path-list li {
      padding: 12px 14px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 600;
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .step-num {
      width: 32px;
      height: 32px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .algo-badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .mini-svg {
      width: 100%;
      max-height: 360px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
    }
    @keyframes flowPath {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    .path-edge-animated {
      stroke-dasharray: 8 4;
      animation: flowPath 0.8s linear infinite;
    }
  </style>
</head>
<body data-page="navigate">
  <main class="main">
    <header class="topbar">
      <div>
        <h1>Find Shortest Route</h1>
        <p class="subtitle">Dijkstra algorithm calculates the lowest-cost path, automatically dodging road closures.</p>
      </div>
      <a href="/map.html" class="btn primary">Open Full Map</a>
    </header>
    <div class="card">
      <div class="route-form">
        <div class="field"><label>Starting Location (From)</label><select id="fromSelect"></select></div>
        <button class="swap-btn" id="swapBtn" type="button" title="Swap locations">⇄</button>
        <div class="field"><label>Destination (To)</label><select id="toSelect"></select></div>
      </div>
      <p id="blockedNote" class="subtitle" style="margin-bottom:14px;font-weight:600;"></p>
      <button class="btn primary" id="findBtn" style="width:100%;margin-bottom:18px;">Find Shortest Path (Dijkstra)</button>
      <div class="result-box" id="resultBox"><div class="empty">Select source and destination</div></div>
      <div id="mapPreview" style="display:none;margin-top:18px;">
        <svg class="mini-svg" id="miniMap" viewBox="0 0 800 700"></svg>
      </div>
    </div>
  </main>
  <script src="/js/graph-data.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/navigate.js"></script>
</body>
</html>
