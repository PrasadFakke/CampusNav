<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusNav • Inside Building</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/map.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    .indoor-svg { width: 100%; max-width: 1000px; height: auto; animation: zoomIn 0.55s ease-out; transform-origin: 8% 80%; }
    @keyframes zoomIn { from { transform: scale(0.35); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .floor-tag { display: inline-block; background: rgba(99,102,241,0.15); color: #a5b4fc; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; margin-left: 10px; vertical-align: middle; }
    .btn.ghost-link { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.ghost-link:hover { border-color: var(--primary); color: #a5b4fc; }
    .step-row { padding: 8px 0; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
    .step-row .n { width: 24px; height: 24px; background: rgba(99,102,241,0.2); color: #a5b4fc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; flex-shrink: 0; }
    .step-row .d { margin-left: auto; color: #9898a8; font-size: 0.75rem; white-space: nowrap; }
    .indoor-node { cursor: pointer; }
    .room-hit { cursor: pointer; }
  </style>
</head>
<body data-page="map">
  <main class="main">
    <header class="topbar">
      <div>
        <h1><span id="bName">Inside Building</span><span class="floor-tag" id="bFloor"></span></h1>
        <p class="subtitle">Click From → To → Calculate. Distances are approximate (metres).</p>
      </div>
      <div class="topbar-actions">
        <a href="/map.html" class="btn primary">← Back to Campus Map</a>
      </div>
    </header>
    <div class="map-layout">
      <div class="map-container">
        <div class="map-canvas">
          <svg class="indoor-svg" id="indoorSvg" viewBox="0 0 990 420"></svg>
        </div>
      </div>
      <div class="info-panel">
        <h2>Indoor Route</h2>
        <div class="selected-box">
          <div style="font-size:0.75rem;color:#9898a8;margin-bottom:4px;">FROM</div>
          <div class="name" id="fromName">Click a room</div>
        </div>
        <div class="selected-box" style="margin-top:10px;">
          <div style="font-size:0.75rem;color:#9898a8;margin-bottom:4px;">TO</div>
          <div class="name" id="toName">Click another room</div>
        </div>
        <button class="btn primary full" id="calcBtn" style="margin-top:14px;" disabled>Calculate Shortest Path</button>
        <button class="btn ghost full" id="clearBtn" style="margin-top:8px;">Clear Selection</button>
        <div id="pathResult" style="margin-top:16px;display:none;">
          <div class="algo-badge" id="pathBadge"></div>
          <div id="pathList" style="margin-top:10px;"></div>
        </div>
        <h3 style="margin-top:20px;">All Rooms</h3>
        <div class="loc-buttons" id="locButtons"></div>
      </div>
    </div>
  </main>
  <script src="/js/graph-data.js"></script>
  <script src="/js/indoor-data.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/indoor.js"></script>
</body>
</html>
