<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusNav • Emergency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body data-page="emergency">
  <main class="main">
    <header class="topbar">
      <div>
        <h1>Emergency Route Assistance</h1>
        <p class="subtitle">Immediate priority route calculation directly to Medical Centre or Campus Security.</p>
      </div>
    </header>
    <div class="card">
      <div class="locate-banner">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="locate-banner-label">🚨 Emergency GPS Location</span>
          <span style="font-size:0.75rem;color:var(--muted);font-weight:600;">Snap your device position instantly</span>
        </div>
        <button class="btn-locate" id="locateBtn" type="button" title="Snap to my GPS position">
          <span class="loc-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
              <circle cx="12" cy="12" r="7" stroke-dasharray="3 2" opacity="0.5"/>
            </svg>
            <span class="loc-ping"></span>
          </span>
          Use my location
        </button>
        <div class="locate-status" id="locateStatus"></div>
      </div>
      <div class="field" style="margin-bottom:20px;">
        <label>Current Location (I am currently at)</label>
        <select id="fromSelect"></select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;">
        <button class="emergency-btn" id="medBtn" type="button" style="margin-bottom:0;">
          🏥 Emergency: Medical Centre
        </button>
        <button class="emergency-btn" id="secBtn" type="button" style="background:linear-gradient(135deg,#2563eb,#4f46e5);margin-bottom:0;">
          🛡️ Emergency: Security Office
        </button>
      </div>
      <div class="card" style="margin-top:20px;background:var(--bg-subtle);border:1.5px solid var(--border);" id="resultBox">
        <div class="empty">Choose your location above, then tap an emergency button for immediate routing</div>
      </div>
    </div>
  </main>
  <script src="/js/graph-data.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/voice.js"></script>
  <script src="/js/voice-global.js"></script>
  <script src="/js/locate.js"></script>
  <script src="/js/emergency.js"></script>
</body>
</html>
