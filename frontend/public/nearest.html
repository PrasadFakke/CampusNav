<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusNav • Nearest Facility</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body data-page="nearest">
  <main class="main">
    <header class="topbar">
      <div>
        <h1>Nearest Facility Finder</h1>
        <p class="subtitle">Quickly find the closest amenities, canteens, washrooms, and campus services.</p>
      </div>
    </header>
    <div class="card">
      <div class="locate-banner">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="locate-banner-label">📍 Device Location</span>
          <span style="font-size:0.75rem;color:var(--muted);font-weight:600;">Snap nearest node as start</span>
        </div>
        <button class="btn-locate" id="locateBtn" type="button" title="Snap to my GPS position">
          <span class="loc-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
              <circle cx="12" cy="12" r="7" stroke-dasharray="3 2" opacity="0.5"/>
            </svg>
            <span class="loc-ping"></span>
          </span>
          Use my location
        </button>
        <div class="locate-status" id="locateStatus"></div>
      </div>
      <div class="field" style="margin-bottom:18px;">
        <label>Current Location (I am at)</label>
        <select id="fromSelect"></select>
      </div>
      <p style="font-size:0.85rem;font-weight:700;color:var(--text);margin-bottom:12px;">Choose Facility Type:</p>
      <div class="facility-grid" id="typeGrid"></div>
      <button class="btn primary" id="findBtn" style="width:100%;margin-top:20px;">Find Nearest Facility</button>
      <div class="card" style="margin-top:20px;background:var(--bg-subtle);border:1.5px solid var(--border);" id="resultBox">
        <div class="empty">Pick your location and a facility type above</div>
      </div>
    </div>
  </main>
  <script src="/js/graph-data.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/locate.js"></script>
  <script src="/js/nearest.js"></script>
</body>
</html>
